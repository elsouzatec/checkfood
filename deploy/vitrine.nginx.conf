# Vitrine de produto (página estática) — https://pagfood.online/produto
# Fonte: /var/www/checkfood/frontend/site/ (sem build: editou, está no ar).
# Instalado em /etc/nginx/snippets/ e incluído no server 443 do vhost
# "checkfood" por deploy/setup-vitrine.sh.
#
# "^~" impede que o regex "\.php$" do vhost capture algo daqui, e locations
# de prefixo/exatas vencem o catch-all "/" do app cliente independentemente
# da ordem no arquivo.

# A página em si: sem barra final, como no CheckAutomate. HTML nunca cacheado.
location = /produto {
    default_type text/html;
    charset utf-8;
    alias /var/www/checkfood/frontend/site/index.html;
    add_header Cache-Control "no-cache, must-revalidate";
}

location = /produto/ {
    return 301 /produto;
}

# Favicon e imagem de preview (og:image).
location ^~ /produto/ {
    alias /var/www/checkfood/frontend/site/;
    expires 7d;
    add_header Cache-Control "public";
    access_log off;
}
