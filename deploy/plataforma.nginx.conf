# ============================================================
# PagFood · App PLATAFORMA (super admin)
# Acesso por IP, porta dedicada, HTTPS (cert self-signed), SEM domínio:
#   https://72.61.46.146:8088/
# Instalar em: /etc/nginx/sites-available/checkfood-plataforma
# Ativar:      ln -s ../sites-available/checkfood-plataforma /etc/nginx/sites-enabled/
# ============================================================

server {
    listen 8088 ssl http2;
    server_name _;

    # Certificado self-signed (ver deploy/certs/ no repo; copiar para /etc/ssl/checkfood/)
    ssl_certificate     /etc/ssl/checkfood/plataforma.crt;
    ssl_certificate_key /etc/ssl/checkfood/plataforma.key;

    root /var/www/checkfood/frontend/apps/plataforma/dist;
    index index.html;

    client_max_body_size 5M;

    # Assets com hash → cache longo
    location /assets/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA (Vue Router em history mode, base '/')
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}

# Observações:
# - Certificado self-signed: o navegador exibirá um aviso de "não confiável" na
#   primeira visita (aceitar/prosseguir). Aceitável para painel interno.
# - O app chama a API em https://pagfood.online/api (VITE_API_URL): HTTPS→HTTPS,
#   sem mixed-content. CORS atual = '*'; auth por token Bearer (sem cookie).
# - Mesmo com HTTPS, restrinja a porta 8088 a redes confiáveis/VPN no firewall.
